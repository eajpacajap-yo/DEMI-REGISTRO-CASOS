<div class="app-shell">

  <!-- ENCABEZADO -->
  <header class="header">

    <div class="brand">
      <div class="logo">
        DEMI
      </div>

      <div>
        <h1>
          {{
            idiomaService.esEspanol()
              ? 'Información y orientación'
              : "K'iche' - Información y orientación"
          }}
        </h1>

        <p>
          Defensoría de la Mujer Indígena
        </p>
      </div>
    </div>

    <button
      class="salida-rapida"
      type="button"
      (click)="salidaRapida()"
    >
      Salida rápida
    </button>

  </header>


  <!-- CONFIGURACIÓN -->
  <section class="barra-configuracion">

    <label>
      Idioma:

      <select
        [value]="idiomaService.idioma()"
        (change)="cambiarIdioma($event)"
      >
        <option value="es">
          Español
        </option>

        <option value="quc">
          K'iche'
        </option>

      </select>
    </label>


    <div
      class="estado"
      [class.offline]="!conexionService.online()"
    >

      <span class="punto"></span>

      {{
        conexionService.online()
          ? 'Con conexión'
          : 'Sin conexión'
      }}

    </div>

  </section>


  <!-- CONTENIDO -->
  <main class="contenido">

    <router-outlet></router-outlet>

  </main>


  <!-- NAVEGACIÓN INFERIOR -->
  <nav class="bottom-nav">

  <a
    class="nav-item"
    routerLink="/inicio"
    routerLinkActive="activo"
  >
    <span class="nav-icon">⌂</span>
    <span>Inicio</span>
  </a>

  <a
    class="nav-item"
    routerLink="/ruta-denuncia"
    routerLinkActive="activo"
  >
    <span class="nav-icon">➜</span>
    <span>Ruta</span>
  </a>

  <a
    class="nav-item"
    routerLink="/prevencion"
    routerLinkActive="activo"
  >
    <span class="nav-icon">✓</span>
    <span>Prevención</span>
  </a>

  <a
    class="nav-item"
    routerLink="/asesoria"
    routerLinkActive="activo"
  >
    <span class="nav-icon">?</span>
    <span>Asesoría</span>
  </a>

</nav>

</div>
