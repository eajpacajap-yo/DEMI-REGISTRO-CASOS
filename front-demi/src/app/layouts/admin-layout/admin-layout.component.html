<div class="dashboard-container">
  
  <!-- BARRA SUPERIOR INSTITUCIONAL FIJA -->
  <header class="navbar">
    <div class="header-top">
      <img 
        src="demiLOGO.png" 
        alt="Logo DEMI" 
        class="logo-img" 
      />
    </div>

    <!-- Navegación estilo Pestañas -->
    <nav class="nav-tabs">
      <a routerLink="/casos" routerLinkActive="tab-active" class="tab-item">Expedientes</a>
      <a *ngIf="esAdmin" routerLink="/multimedia" routerLinkActive="tab-active" class="tab-item">Multimedia</a>
      <a *ngIf="esAdmin" routerLink="/reportes" routerLinkActive="tab-active" class="tab-item">Reportes</a>
      <a *ngIf="esAdmin" routerLink="/usuarias" routerLinkActive="tab-active" class="tab-item">Usuarias</a>
    </nav>

    <!-- Información de usuario y acciones -->
    <div class="user-info">
      <div class="user-meta">
        <span class="user-name">{{ usuario?.nombreCompleto }}</span>
        <span class="user-role">{{ usuario?.rol }}</span>
      </div>
      <button (click)="abrirModalPassword()" class="btn-user-action" title="Cambiar mi contraseña">
        Cambiar contraseña
      </button>
      <button (click)="cerrarSesion()" class="btn-logout" title="Cerrar Sesión">
        Cerrar Sesión
      </button>
    </div>
  </header>

  <!-- CONTENIDO HIJO -->
  <router-outlet></router-outlet>

  <!-- MODAL CAMBIAR CONTRASEÑA GLOBAL -->
  <div *ngIf="mostrarModalPassword" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <h4>Cambiar Mi Contraseña</h4>
        <button type="button" (click)="cerrarModalPassword()" class="btn-close">&times;</button>
      </div>
      <form (ngSubmit)="ejecutarCambioPassword()">
        <div class="modal-body">
          <div *ngIf="errorPassword" class="alert-error">{{ errorPassword }}</div>
          <div *ngIf="mensajeExitoPassword" class="alert-success">{{ mensajeExitoPassword }}</div>

          <!-- Contraseña Actual -->
          <div class="form-group">
            <label>Contraseña Actual</label>
            <div class="password-wrapper">
              <input 
                [type]="mostrarPasswordActual ? 'text' : 'password'" 
                name="passwordActual" 
                [(ngModel)]="passwordForm.passwordActual" 
                placeholder="Ingresa tu clave actual" 
                required 
              />
              <button 
                type="button" 
                class="btn-toggle-eye" 
                (click)="togglePasswordActual()" 
                [title]="mostrarPasswordActual ? 'Ocultar contraseña' : 'Ver contraseña'"
                tabindex="-1"
              >
                👁︎
              </button>
            </div>
          </div>

          <!-- Nueva Contraseña -->
          <div class="form-group">
            <label>Nueva Contraseña</label>
            <div class="password-wrapper">
              <input 
                [type]="mostrarPasswordNueva ? 'text' : 'password'" 
                name="nuevoPassword" 
                [(ngModel)]="passwordForm.nuevoPassword" 
                placeholder="Mínimo 12 caracteres" 
                required 
              />
              <button 
                type="button" 
                class="btn-toggle-eye" 
                (click)="togglePasswordNueva()" 
                [title]="mostrarPasswordNueva ? 'Ocultar contraseña' : 'Ver contraseña'"
                tabindex="-1"
              >
                👁︎
              </button>
            </div>
          </div>

          <!-- Confirmar Nueva Contraseña -->
          <div class="form-group">
            <label>Confirmar Nueva Contraseña</label>
            <div class="password-wrapper">
              <input 
                [type]="mostrarPasswordConfirmar ? 'text' : 'password'" 
                name="confirmarPassword" 
                [(ngModel)]="passwordForm.confirmarPassword" 
                placeholder="Repite la nueva clave" 
                required 
              />
              <button 
                type="button" 
                class="btn-toggle-eye" 
                (click)="togglePasswordConfirmar()" 
                [title]="mostrarPasswordConfirmar ? 'Ocultar contraseña' : 'Ver contraseña'"
                tabindex="-1"
              >
                👁︎
              </button>
            </div>
          </div>

        </div>
        <div class="modal-footer">
          <button type="button" (click)="cerrarModalPassword()" class="btn-secondary" [disabled]="guardandoPassword">Cancelar</button>
          <button type="submit" [disabled]="guardandoPassword || !!mensajeExitoPassword" class="btn-primary">
            {{ guardandoPassword ? 'Verificando...' : 'Actualizar Clave' }}
          </button>
        </div>
      </form>
    </div>
  </div>

</div>
